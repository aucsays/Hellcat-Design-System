  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+'<\u002Fdiv><div class=\"mod-f\"><button class=\"btn btn-secondary\">Cancel<\u002Fbutton><button class=\"btn btn-primary\">Create scope<\u002Fbutton><\u002Fdiv><\u002Fdiv>'\n+'<\u002Fdiv><\u002Fdiv>'\n\n+'<div class=\"block\"><div class=\"sec-label\">List Modal<\u002Fdiv><div class=\"card card-pad\">'\n+'<div class=\"mod\" style=\"animation:none;max-width:500px\">'\n+'<div class=\"mod-h\"><h3>Selected controls <span class=\"badge info\" style=\"margin-left:6px\">4<\u002Fspan><\u002Fh3><button class=\"x\">'+ico('x',19)+'<\u002Fbutton><\u002Fdiv>'\n+'<div class=\"mod-b\" style=\"padding-bottom:8px\">'\n+[['AC-2','Account management','critical'],['AC-6','Least privilege','good'],\n  ['AU-6','Audit review','medium'],['SC-7','Boundary protection','good']]\n.map(function(n){return '<div style=\"display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)\">'\n  +'<span style=\"width:34px;height:34px;border-radius:9px;background:rgba(var(--tint-rgb),.08);display:grid;place-items:center;color:var(--accent)\">'+ico('shield',16)+'<\u002Fspan>'\n  +'<span style=\"flex:1\"><span class=\"mono\" style=\"font-size:12px;color:var(--text-3)\">'+n[0]+'<\u002Fspan><br>'\n  +'<span style=\"font-size:13.5px;color:var(--text-2)\">'+n[1]+'<\u002Fspan><\u002Fspan>'\n  +'<span class=\"badge '+n[2]+'\"><span class=\"dot\"><\u002Fspan><\u002Fspan>'\n  +'<button class=\"btn btn-icon btn-sm\">'+ico('x',14)+'<\u002Fbutton><\u002Fdiv>';}).join('')\n+'<\u002Fdiv><div class=\"mod-f\"><button class=\"btn btn-secondary\">Cancel<\u002Fbutton><button class=\"btn btn-primary\">Add to scope<\u002Fbutton><\u002Fdiv><\u002Fdiv>'\n+'<\u002Fdiv><\u002Fdiv>';\n};\n\n/* ===================== GLASS ===================== */\nSEC.glass=function(){\n  var styles=[\n    ['gl-frost','Frosted','The default card. Mid-alpha fill, 26px blur, specular top edge.','--glass-bg · blur(26px)'],\n    ['gl-clear','Clear','Low-alpha fill with heavy blur. For chrome that floats over content.','blur(40px) saturate(1.9)'],\n    ['gl-tint','Tinted','Primary-tinted glass. Selection, active filters, AI surfaces.','rgba(--accent-rgb,.16)'],\n    ['gl-lift','Elevated','Same material, deeper shadow and a 4px lift. Modals and menus.','--glass-shadow-hi'],\n    ['gl-solid','Opaque','No blur. The fallback when glass would sit on glass, or in print.','--panel']\n  ];\n  var blurs=[[8,'blur-1 · inline chips'],[14,'blur-2 · controls'],[26,'blur-3 · cards'],[40,'blur-4 · chrome']];\n  return ''\n+'<div class=\"block\"><div class=\"sec-label\">Material<\u002Fdiv>'\n+'<div class=\"block-note\">One material, five treatments. Glass is a <b>surface<\u002Fb> decision, never a decoration: if a panel floats above content that keeps moving or scrolling, it is glass; if it holds the content, it is opaque.<\u002Fdiv>'\n+'<div class=\"bed\"><div class=\"bed-g\">'\n+styles.map(function(s){return '<div class=\"gl '+s[0]+'\"><div class=\"gl-t\">'+s[1]+'<\u002Fdiv><div class=\"gl-d\">'+s[2]+'<\u002Fdiv><div class=\"gl-c\">'+s[3]+'<\u002Fdiv><\u002Fdiv>';}).join('')\n+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n\n+'<div class=\"block\"><div class=\"sec-label\">Blur Scale<\u002Fdiv>'\n+'<div class=\"block-note\">Four steps, each tied to how far the surface sits from the canvas. Never interpolate — a 20px blur reads as a rendering bug next to a 26px card.<\u002Fdiv>'\n+'<div class=\"bed\"><div class=\"bed-g\" style=\"grid-template-columns:repeat(auto-fit,minmax(160px,1fr))\">'\n+blurs.map(function(b){return '<div class=\"blur-t\" style=\"background:rgba(var(--tint-rgb),.07);backdrop-filter:blur('+b[0]+'px) saturate(1.5);-webkit-backdrop-filter:blur('+b[0]+'px) saturate(1.5)\">'+b[1]+'<\u002Fdiv>';}).join('')\n+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n\n+'<div class=\"block\"><div class=\"sec-label\">Specular &amp; Edge<\u002Fdiv>'\n+'<div class=\"block-note\">Every glass surface carries three light cues, layered in this order: a 155° sheen across the top-left, a 1px inner highlight on the top edge, and a long soft shadow beneath. Remove any one and the surface stops reading as glass.<\u002Fdiv>'\n+'<div class=\"bed\"><div class=\"bed-g\" style=\"grid-template-columns:repeat(auto-fit,minmax(230px,1fr))\">'\n+[['Sheen only','background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)'],\n  ['Sheen + edge','background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:0 1px 0 var(--glass-hi) inset'],\n  ['Sheen + edge + shadow','background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow)']]\n.map(function(s){return '<div class=\"gl\" style=\"'+s[1]+'\"><div class=\"gl-t\">'+s[0]+'<\u002Fdiv><div class=\"gl-c\" style=\"margin-top:auto\">'+(s[0].split(' + ').length)+' of 3 cues<\u002Fdiv><\u002Fdiv>';}).join('')\n+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n\n+'<div class=\"block\"><div class=\"sec-label\">Glass Controls<\u002Fdiv>'\n+'<div class=\"block-note\">Controls use blur-2 so they stay readable at small sizes. Primary actions stay a solid gradient — a translucent primary button loses the one thing it needs, which is weight.<\u002Fdiv>'\n+'<div class=\"bed\"><div class=\"col\" style=\"gap:20px\">'\n+'<div class=\"gbar\"><button class=\"btn btn-primary btn-sm\" style=\"border-radius:999px\">'+ico('plus',14)+'New scope<\u002Fbutton>'\n+'<button class=\"btn btn-secondary btn-sm\" style=\"border-radius:999px\">'+ico('filter',14)+'Filter<\u002Fbutton>'\n+'<button class=\"btn btn-secondary btn-sm\" style=\"border-radius:999px\">'+ico('download',14)+'Export<\u002Fbutton>'\n+'<div class=\"tabs-pill\" style=\"margin-left:auto\"><button class=\"tab-pill\" aria-selected=\"true\">List<\u002Fbutton><button class=\"tab-pill\" aria-selected=\"false\">Board<\u002Fbutton><\u002Fdiv><\u002Fdiv>'\n+'<div class=\"sb round\" style=\"max-width:420px\">'+ico('search',17)+'<input placeholder=\"Search controls and findings\"><\u002Fdiv>'\n+'<div class=\"row\"><span class=\"tag\">ISO 27001<\u002Fspan><span class=\"tag\">Critical only<\u002Fspan><span class=\"tag\">Owner: Priya N.<\u002Fspan>'\n+'<span class=\"badge info\"><span class=\"dot\"><\u002Fspan>Live<\u002Fspan><\u002Fdiv>'\n+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n\n+'<div class=\"block\"><div class=\"sec-label\">Rules<\u002Fdiv><div class=\"card card-pad\"><div class=\"col\" style=\"gap:14px\">'\n+[['good','Glass over the canvas, over imagery, or over a scrolling list.'],\n  ['good','One level of glass at a time. Nest an opaque panel inside a glass one, not more glass.'],\n  ['critical','Never glass on body copy blocks — the blur cost is paid on every scroll frame.'],\n  ['critical','Never below 4.5:1. If the backdrop can be anything, raise the fill alpha until it clears.'],\n  ['medium','Honour <span class=\"mono\">prefers-reduced-transparency<\u002Fspan>: fall back to the Opaque treatment.']]\n.map(function(r){return '<div style=\"display:flex;align-items:flex-start;gap:12px;font-size:13.5px;color:var(--text-2);line-height:1.6\">'\n  +'<span style=\"color:var(--'+(r[0]==='good'?'good':r[0]==='critical'?'critical':'medium')+');flex:0 0 auto;margin-top:2px\">'+ico(r[0]==='good'?'check':r[0]==='critical'?'x':'alert',16)+'<\u002Fspan>'\n  +'<span>'+r[1]+'<\u002Fspan><\u002Fdiv>';}).join('')\n+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n};\n\n/* ===================== LAYERS ===================== */\nfunction layerStack(label,bg,tintRgb,labelInk,chipBg,order){\n  var steps=[[600,30],[500,24],[400,20],[300,15],[200,10],[100,5]];\n  var labs=steps.map(function(s){\n    return '<div class=\"lyr-lab\" style=\"color:'+labelInk+'\">'\n      +(order==='rev'?'<span>'+s[1]+'%<\u002Fspan><span class=\"lyr-tok\" style=\"background:'+chipBg+'\">'+s[0]+'<\u002Fspan>'\n                     :'<span class=\"lyr-tok\" style=\"background:'+chipBg+'\">'+s[0]+'<\u002Fspan><span>'+s[1]+'%<\u002Fspan>')+'<\u002Fdiv>';}).join('');\n  var stack=steps.map(function(s,i){\n    return '<i style=\"top:'+(i*30)+'px;background:rgba('+tintRgb+','+(s[1]/100)+')\"><\u002Fi>';}).join('');\n  return '<div><div class=\"lyr-wrap\" style=\"background:'+bg+(order==='rev'?';grid-template-columns:minmax(148px,1fr) 86px':'')+'\">'\n    +(order==='rev'?'<div class=\"lyr-stage\">'+stack+'<\u002Fdiv><div class=\"lyr-labs r\">'+labs+'<\u002Fdiv>'\n                   :'<div class=\"lyr-labs\">'+labs+'<\u002Fdiv><div class=\"lyr-stage\">'+stack+'<\u002Fdiv>')\n    +'<\u002Fdiv><div class=\"lyr-cap\" style=\"color:var(--text-3)\">'+label+'<\u002Fdiv><\u002Fdiv>';\n}\nSEC.layers=function(){\n  var use=[['600','30%','Pressed states, selected rows, the deepest inset well.'],\n    ['500','24%','Hover on a selected item, scrollbar thumb, active chip.'],\n    ['400','20%','Sidebar active item, tab-pill track, filled badge.'],\n    ['300','15%','Hover on any row, button or nav item.'],\n    ['200','10%','Chip and tag fills, table header, section label.'],\n    ['100','5%','Field wells, card insets, the quietest divider fill.']];\n  return ''\n+'<div class=\"block\"><div class=\"sec-label\">Alt Layers<\u002Fdiv>'\n+'<div class=\"block-note\">Instead of shipping six greys per mode, the system ships <b>one<\u002Fb> tint and six alphas. The tint is <span class=\"mono\">--tint-rgb<\u002Fspan> — cool blue in Dark, cool grey in Light, pure white in Hellcat — and every fill in the product is that tint at one of six fixed opacities. A component written once therefore lands correctly in all three modes.<\u002Fdiv>'\n+'<div class=\"lyr-g\">'\n+layerStack('Light — ink tint on a pale canvas','#EAF0FA','30, 41, 70','#41506B','rgba(30,41,70,.09)','fwd')\n+layerStack('Dark — cool blue tint on Abyss','#03070F','143, 166, 194','#9FB4CC','rgba(143,166,194,.14)','rev')\n+layerStack('Hellcat — pure white tint on carbon','#08080A','255, 255, 255','#B6B6C0','rgba(255,255,255,.10)','rev')\n+'<\u002Fdiv><\u002Fdiv>'\n\n+'<div class=\"block\"><div class=\"sec-label\">Active Mode<\u002Fdiv>'\n+'<div class=\"block-note\">The same stack drawn live from <span class=\"mono\">rgba(var(--tint-rgb), α)<\u002Fspan> in the mode you are in now.<\u002Fdiv>'\n+'<div class=\"card card-pad\"><div style=\"max-width:420px;margin:0 auto\">'\n+layerStack('rgba(var(--tint-rgb), α) on var(--bg)','var(--bg)','var(--tint-rgb)','var(--text-2)','rgba(var(--tint-rgb),.12)','fwd')\n+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n\n+'<div class=\"block\"><div class=\"sec-label\">Where Each Layer Goes<\u002Fdiv><div class=\"card card-pad\">'\n+use.map(function(u,i){\n  return '<div style=\"display:flex;align-items:center;gap:18px;padding:13px 0'+(i<use.length-1?';border-bottom:1px solid var(--line-soft)':'')+'\">'\n  +'<span style=\"width:52px;flex:0 0 auto;height:34px;border-radius:10px;background:rgba(var(--tint-rgb),'+(parseInt(u[1])/100)+');border:1px solid var(--line-soft)\"><\u002Fspan>'\n  +'<span class=\"mono\" style=\"width:44px;flex:0 0 auto;font-size:12.5px;color:var(--accent);font-weight:500\">'+u[0]+'<\u002Fspan>'\n  +'<span class=\"mono\" style=\"width:44px;flex:0 0 auto;font-size:12px;color:var(--text-3)\">'+u[1]+'<\u002Fspan>'\n  +'<span style=\"flex:1;min-width:0;font-size:13.5px;color:var(--text-2)\">'+u[2]+'<\u002Fspan><\u002Fdiv>';}).join('')\n+'<div class=\"hint\">Layers are for <b>fills<\u002Fb>. Borders come from <span class=\"mono\">--line<\u002Fspan> and <span class=\"mono\">--line-soft<\u002Fspan>, and text always comes from the three ink tokens — never from an alpha layer, because alpha text over an unknown backdrop cannot be contrast-tested.<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n};\n\n/* ===================== GRAPHS ===================== */\nfunction gSmooth(vals,w,hh,min,max){\n  var n=vals.length,ix=w/(n-1);\n  var p=vals.map(function(v,i){return [i*ix, hh-((v-min)/(max-min))*hh];});\n  var d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);\n  for(var i=0;i<p.length-1;i++){var a=p[i],b=p[i+1],cx=(a[0]+b[0])/2;\n    d+=' C'+cx.toFixed(1)+' '+a[1].toFixed(1)+','+cx.toFixed(1)+' '+b[1].toFixed(1)+','+b[0].toFixed(1)+' '+b[1].toFixed(1);}\n  return d;\n}\nfunction gPoly(vals,w,hh,min,max){\n  var n=vals.length,ix=w/(n-1);\n  return vals.map(function(v,i){return (i*ix).toFixed(1)+','+(hh-((v-min)/(max-min))*hh).toFixed(1);}).join(' ');\n}\nfunction gGrid(w,hh,rows){\n  var o='';for(var i=0;i<=rows;i++){var y=(hh/rows*i).toFixed(1);\n    o+='<line x1=\"0\" y1=\"'+y+'\" x2=\"'+w+'\" y2=\"'+y+'\" stroke=\"var(--line-soft)\" stroke-width=\"1\"/>';}\n  return o;\n}\nfunction gCard(title,sub,val,body,legend){\n  return '<div class=\"g-card\"><div class=\"g-head\"><div><div class=\"g-t\">'+title+'<\u002Fdiv><div class=\"g-s\">'+sub+'<\u002Fdiv><\u002Fdiv>'\n    +(val?'<div class=\"g-v\">'+val+'<\u002Fdiv>':'')+'<\u002Fdiv>'+body\n    +(legend?'<div class=\"g-leg\">'+legend+'<\u002Fdiv>':'')+'<\u002Fdiv>';\n}\nfunction gLeg(items){return items.map(function(i){return '<span class=\"g-li\"><i style=\"background:'+i[1]+'\"><\u002Fi>'+i[0]+'<\u002Fspan>';}).join('');}\nfunction spark(vals,col,w,hh){\n  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),pad=(mx-mn)*.25||1;\n  return '<svg viewBox=\"0 0 '+w+' '+hh+'\" width=\"'+w+'\" height=\"'+hh+'\" fill=\"none\" style=\"flex:0 0 auto;overflow:visible\">'\n    +'<path d=\"'+gSmooth(vals,w,hh,mn-pad,mx+pad)+'\" stroke=\"'+col+'\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>';\n}\nSEC.graphs=function(){\n  var X=extHex(), lightMode=theme()==='light';\n  var onFill = lightMode ? '#fff' : 'rgba(0,0,0,.78)';\n\n  /* 1 — area */\n  var trend=[58,61,60,66,69,68,74,77,76,81,84,86];\n  var area=(function(){\n    var w=560,hh=170,mn=45,mx=95;\n    return '<svg class=\"g-plot\" viewBox=\"0 0 '+w+' '+hh+'\" preserveAspectRatio=\"none\" height=\"170\" fill=\"none\">'\n      +'<defs><linearGradient id=\"ga1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">'\n      +'<stop offset=\"0%\" stop-color=\"var(--accent)\" stop-opacity=\".42\"/><stop offset=\"100%\" stop-color=\"var(--accent)\" stop-opacity=\"0\"/><\u002FlinearGradient><\u002Fdefs>'\n      +gGrid(w,hh,4)\n      +'<path d=\"'+gSmooth(trend,w,hh,mn,mx)+' L'+w+' '+hh+' L0 '+hh+' Z\" fill=\"url(#ga1)\"/>'\n      +'<path d=\"'+gSmooth(trend,w,hh,mn,mx)+'\" stroke=\"var(--accent)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'\n      +'<circle cx=\"'+w+'\" cy=\"'+(hh-((86-mn)/(mx-mn))*hh).toFixed(1)+'\" r=\"4.5\" fill=\"var(--accent)\" stroke=\"var(--panel)\" stroke-width=\"2.5\"/>'\n      +'<\u002Fsvg><div class=\"g-ax\"><span>Oct<\u002Fspan><span>Jan<\u002Fspan><span>Apr<\u002Fspan><span>Jul<\u002Fspan><span>Sep<\u002Fspan><\u002Fdiv>';\n  })();\n\n  /* 2 — multi-series line */\n  var multi=(function(){\n    var w=560,hh=170,mn=0,mx=60;\n    var s=[[[12,18,24,21,30,34,31,38,42,39,45,48],X.blue,'Findings opened'],\n           [[8,11,14,19,22,28,30,33,36,40,43,46],X.green,'Findings closed'],\n           [[22,20,19,17,16,15,13,12,11,9,8,7],X.orange,'Ageing > 30d']];\n    return '<svg class=\"g-plot\" viewBox=\"0 0 '+w+' '+hh+'\" preserveAspectRatio=\"none\" height=\"170\" fill=\"none\">'\n      +gGrid(w,hh,4)\n      +s.map(function(x){return '<path d=\"'+gSmooth(x[0],w,hh,mn,mx)+'\" stroke=\"'+x[1]+'\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';}).join('')\n      +'<\u002Fsvg><div class=\"g-ax\"><span>Oct<\u002Fspan><span>Jan<\u002Fspan><span>Apr<\u002Fspan><span>Jul<\u002Fspan><span>Sep<\u002Fspan><\u002Fdiv>';\n  })();\n\n  /* 3 — bars */\n  var bars=(function(){\n    var d=[[34,'ISO 27001'],[52,'SOC 2'],[41,'NIST CSF'],[28,'PCI DSS'],[46,'HIPAA'],[19,'CIS v8'],[37,'GDPR']];\n    var mx=60,w=560,hh=170,bw=w/d.length*.52,gp=w/d.length;\n    return '<svg class=\"g-plot\" viewBox=\"0 0 '+w+' '+hh+'\" preserveAspectRatio=\"none\" height=\"170\" fill=\"none\">'\n      +'<defs><linearGradient id=\"gb as the Contentstack file ===================== */\nconst NAV=[\n  {title:'Content', items:[['colours','Colours'],['typography','Typography']]},\n  {title:'Material', items:[['glass','Glass'],['layers','Layers']]},\n  {title:'Elements', items:[['buttons','Buttons'],['avtars','Avtars'],['checkbox','Checkbox'],['radio','Radio Buttons'],['feedback','Feedback'],['tabs','Tabs'],['tags','Tags'],['toggle','Toggle'],['tooltips','Tooltips'],['select','Select']]},\n  {title:'Components', items:[['datetime','Date/Time Picker'],['searchbar','Searchbar'],['navigation','Navigation'],['tables','Tables'],['form','Form Elements']]},\n  {title:'Data Visualisation', items:[['graphs','Graphs']]},\n  {title:'Spacing and Grids', items:[['spacings','Spacings']]},\n  {title:'Images', items:[['icons','Icons']]},\n  {title:'Motion', items:[['shimmer','Shimmer'],['loader','Loader']]},\n  {title:'Asset Gallery', self:'gallery'},\n  {title:'Pop-Up Modals', self:'modals'}\n];\nconst TITLES={\n  colours:'Colors', typography:'Typography', glass:'Glass', layers:'Layers', buttons:'Buttons', avtars:'Avtars',\n  checkbox:'Checkbox', radio:'Radio Buttons', feedback:'Feedback', tabs:'Tabs',\n  tags:'Tags', toggle:'Toggle', tooltips:'Tooltips', select:'Select',\n  datetime:'Date/Time Picker', searchbar:'Searchbar', navigation:'Navigation',\n  tables:'Tables', form:'Form Elements', graphs:'Graphs', spacings:'Spacings', icons:'Icons',\n  shimmer:'Shimmer', loader:'Loader',\n  gallery:'Asset Gallery', modals:'Pop-Up Modals'\n};\nconst LEDE={\n  colours:'Every token defined once and mirrored across Light, Dark and Hellcat, so no component ever branches on mode.',\n  typography:'Satoshi for structure, DM Sans for prose, JetBrains Mono for identifiers.',\n  buttons:'Four ranks, four sizes. One primary per view; destructive only inside a confirmation.',\n  avtars:'Initials, presence, groups and the identity rows that carry them.',\n  checkbox:'Selection controls with their indeterminate, disabled and parent-chil 14 Aug 2026'],\n  ['AC-6 · Least privilege','ISO 27001','Priya Nair','good','02 Sep 2026'],\n  ['AU-6 · Audit review','SOC 2','Jonas Meyer','medium','28 Jul 2026'],\n  ['CM-3 · Change control','SOC 2','Amara Toure','good','05 Sep 2026'],\n  ['IR-4 · Incident handling','NIST CSF','Jonas Meyer','high','19 Jun 2026'],\n  ['SC-7 · Boundary protection','PCI DSS','Amara Toure','good','01 Sep 2026']\n];\nconst ST={good:'Passed',medium:'Partial',high:'At risk',critical:'Failed'};\nconst AVA={'Priya Nair':['PN',''],'Jonas Meyer':['JM','c2'],'Amara Toure':['AT','c3']};\nfunction paint(rows){\n  const tb=document.querySelector('#tbl tbody'); if(!tb) return;\n  tb.innerHTML=rows.map(function(r){\n    const a=AVA[r[2]];\n    return '<tr><td><label class=\"ch\"><input type=\"checkbox\" class=\"rs\"><span class=\"bx\">'+ico('check',12)+'<\u002Fspan><\u002Flabel><\u002Ftd>'\n    +'<td style=\"color:var(--text);font-weight:500\">'+r[0]+'<\u002Ftd><td>'+r[1]+'<\u002Ftd>'\n    +'<td><span style=\"display:flex;align-items:center;gap:10px\"><span class=\"av xs '+a[1]+'\">'+a[0]+'<\u002Fspan>'+r[2]+'<\u002Fspan><\u002Ftd>'\n    +'<td><span class=\"badge '+r[3]+'\"><span class=\"dot\"><\u002Fspan>'+ST[r[3]]+'<\u002Fspan><\u002Ftd>'\n    +'<td class=\"mono\" style=\"font-size:13px\">'+r[4]+'<\u002Ftd>'\n    +'<td><div class=\"racts\"><button aria-label=\"View\">'+ico('eye',15)+'<\u002Fbutton>'\n    +'<button aria-label=\"Edit\">'+ico('edit',15)+'<\u002Fbutton>'\n    +'<button class=\"dg\" aria-label=\"Retire\">'+ico('trash',15)+'<\u002Fbutton><\u002Fdiv><\u002Ftd><\u002Ftr>';\n  }).join('');\n  bindSel();\n}\nfunction bindSel(){\n  const c=document.getElementById('selCount'); if(!c) return;\n  const bs=[].slice.call(document.querySelectorAll('.rs')),all=document.getElementById('selAll');\n  function sync(){\n    const n=bs.filter(function(b){return b.checked;}).length;\n    c.textContent=n+' selected';\n    if(all){all.checked=n===bs.length&&n>0;all.indeterminate=n>0&&n<bs.length;}\n  }\n  bs.forEach(function(b){b.onchange=sync;});\n  if(all) all.onchange=function(){bs.forEach(function(b){b.checked=all.checked;});sync();};\n  sync();\n}\n\n/* ===================== WIRE ===================== */\nfunction wire(){\n  content.querySelectorAll('[data-copy]').forEach(function(el){el.onclick=function(){copied(el.dataset.copy);};});\n  content.querySelectorAll('[data-goto]').forEach(function(el){el.onclick=function(){go(el.dataset.goto);};});\n  content.querySelectorAll('input.ind').forEach(function(i){i.indeterminate=true;});\n\n  content.querySelectorAll('[data-dd]').forEach(function(dd){\n    const t=dd.querySelector('.dd-t'),v=dd.querySelector('[data-val]'),mode=dd.dataset.mode;\n    t.onclick=function(e){\n      e.stopPropagation();\n      const open=dd.classList.contains('open');\n      closeMenus(); if(!open) dd.classList.add('open');\n    };\n    const s=dd.querySelector('[data-ddsearch]');\n    if(s){\n      s.onclick=function(e){e.stopPropagation();};\n      s.oninput=function(){\n        const q=s.value.trim().toLowerCase();\n        dd.querySelectorAll('.dd-o').forEach(function(o){\n          o.style.display=(!q||o.textContent.toLowerCase().includes(q))?'':'none';});\n      };\n    }\n    dd.querySelectorAll('.dd-o').forEach(function(o){\n      o.onclick=function(e){\n        e.stopPropagation();\n        if(mode==='multi'){\n          const on=o.getAttribute('aria-selected')==='true';\n          o.setAttribute('aria-selected',on?'false':'true');\n          const n=dd.querySelectorAll('.dd-o[aria-selected=\"true\"]').length;\n          if(v) v.textContent=n===0?'None selected':(n===1\n            ?dd.querySelector('.dd-o[aria-selected=\"true\"]').textContent.trim():n+' selected');\n        } else if(mode==='single'){\n          dd.querySelectorAll('.dd-o').forEach(function(x){x.setAttribute('aria-selected','false');});\n          o.setAttribute('aria-selected','true');\n          if(v) v.innerHTML=o.innerHTML.replace(/<span class=\"tk\">[\\s\\S]*?<\\/span>/,'');\n          dd.classList.remove('open');\n        } else {dd.classList.remove('open');notify('info');}\n      };\n    });\n  });\n\n  content.querySelectorAll('[data-tabs]').forEach(function(set){\n    const ts=[].slice.call(set.querySelectorAll('[role=\"tab\"]'));\n    const ps=[].slice.call(set.querySelectorAll('[role=\"tabpanel\"]'));\n    ts.forEach(function(t,i){\n      t.onclick=function(){\n        ts.forEach(function(x){x.setAttribute('aria-selected','false');});\n        t.setAttribute('aria-selected','true');\n        ps.forEach(function(p,j){p.classList.toggle('hide',j!==i);});\n      };\n    });\n  });\n  content.querySelectorAll('[data-pills]').forEach(function(g){\n    g.querySelectorAll('.tab-pill').forEach(function(p){\n      p.onclick=function(){\n        g.querySelectorAll('.tab-pill').forEach(function(x){x.setAttribute('aria-selected','false');});\n        p.setAttribute('aria-selected','true');};\n    });\n  });\n\n  const all=document.getElementById('cbAll');\n  if(all){\n    const kids=[].slice.call(document.querySelectorAll('.cbKid'));\n    const s2=function(){\n      const n=kids.filter(function(k){return k.checked;}).length;\n      all.checked=n===kids.length;all.indeterminate=n>0&&n<kids.length;\n    };\n    kids.forEach(function(k){k.onchange=s2;});\n    all.onchange=function(){kids.forEach(function(k){k.checked=all.checked;});s2();};\n    s2();\n  }\n\n  content.querySelectorAll('.tag button').forEach(function(b){\n    b.onclick=function(e){e.stopPropagation();b.closest('.tag').remove();};});\n  const ti=document.getElementById('tagInput');\n  if(ti){\n    const inp=ti.querySelector('input');\n    inp.onkeydown=function(e){\n      if(e.key==='Enter'&&inp.value.trim()){\n        e.preventDefault();\n        const c=document.createElement('span');\n        c.className='tag';\n        c.innerHTML=inp.value.trim()+' <button aria-label=\"Remove\">'+ico('x',12)+'<\u002Fbutton>';\n        c.querySelector('button').onclick=function(){c.remove();};\n        ti.insertBefore(c,inp);inp.value='';\n      } else if(e.key==='Backspace'&&!inp.value){\n        const l=[].slice.call(ti.querySelectorAll('.tag')).pop(); if(l) l.remove();\n      }\n    };\n  }\n\n  content.querySelectorAll('[data-note]').forEach(function(b){b.onclick=function(){notify(b.dataset.note);};});\n  content.querySelectorAll('.note .n-x').forEach(function(b){b.onclick=function(){b.closest('.note').remove();};});\n  content.querySelectorAll('[data-modal]').forEach(function(b){b.onclick=function(){openModal(b.dataset.modal);};});\n\n  const dz=document.getElementById('drop');\n  if(dz){\n    dz.onclick=function(){notify('success');};\n    ['dragover','dragenter'].forEach(function(ev){dz.addEventListener(ev,function(e){\n      e.preventDefault();dz.style.borderColor='var(--accent)';dz.style.background='rgba(var(--tint-rgb),.09)';});});\n    ['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){\n      e.preventDefault();dz.style.borderColor='';dz.style.background='';});});\n  }\n\n  const c1=document.getElementById('cal1');\n  if(c1) buildCal(c1,{onPick:function(d){const o=document.getElementById('calOut');if(o)o.value=fmt(d);}});\n  const c2=document.getElementById('cal2');\n  if(c2) buildCal(c2,{range:true,onRange:function(a,b){\n    const o=document.getElementById('rngOut');\n    if(o) o.textContent=!a?'No range selected':(b?fmt(a)+'  →  '+fmt(b):fmt(a)+'  →  pick an end date');}});\n\n  const tH=document.getElementById('tH');\n  if(tH){\n    const tM=document.getElementById('tM'),tP=document.getElementById('tP');\n    const pk={h:'09',m:'30',p:'AM'};\n    const out=function(){const o=document.getElementById('timeOut');if(o)o.value=pk.h+':'+pk.m+' '+pk.p;};\n    const col=function(host,vals,key){\n      host.innerHTML=vals.map(function(v){return '<button data-v=\"'+v+'\"'+(pk[key]===v?' class=\"on\"':'')+'>'+v+'<\u002Fbutton>';}).join('');\n      host.onclick=function(e){\n        const b=e.target.closest('[data-v]'); if(!b) return;\n        pk[key]=b.dataset.v;\n        host.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});\n        b.classList.add('on');out();\n      };\n    };\n    const pad=function(n){return String(n).padStart(2,'0');};\n    col(tH,Array.from({length:12},function(_,i){return pad(i+1);}),'h');\n    col(tM,['00','15','30','45'],'m');\n    col(tP,['AM','PM'],'p');\n    out();\n  }\n\n  if(document.getElementById('tbl')){\n    let rows=ROWS.slice(),key=null,dir=1;\n    paint(rows);\n    document.querySelectorAll('#tbl th.sortable').forEach(function(th){\n      th.onclick=function(){\n        const k=+th.dataset.k;\n        dir=(key===k)?-dir:1;key=k;\n        document.querySelectorAll('#tbl th.sortable').forEach(function(x){x.setAttribute('aria-sort','none');});\n        th.setAttribute('aria-sort',dir===1?'ascending':'descending');\n        th.querySelector('.so').innerHTML=ico(dir===1?'sortUp':'sortDown',12);\n        rows.sort(function(a,b){return a[k].localeCompare(b[k])*dir;});\n        filt();\n      };\n    });\n    const f=document.getElementById('tFilter');\n    function filt(){\n      const q=(f&&f.value.trim().toLowerCase())||'';\n      paint(rows.filter(function(r){return !q||r.join(' ').toLowerCase().includes(q);}));\n    }\n    if(f) f.oninput=filt;\n    if(!content.dataset.delBound){\n      content.dataset.delBound='1';\n      content.addEventListener('click',function(e){\n        if(e.target.closest('.racts .dg')) openModal('retire');});\n    }\n  }\n\n  const np=document.getElementById('navPrev');\n  if(np){\n    const body=document.getElementById('npBody'),crumb=document.getElementById('npCrumb');\n    const COPY={\n      'Dashboard':'Dashboard — posture score, open findings and the controls due for review this week.',\n      'Compliance':'Compliance — 240 controls across 4 frameworks. 186 assessed, 48 awaiting evidence, 6 failed.',\n      'Threat Exposure':'Threat Exposure — 18 exposures ranked by asset criticality and exploit availability.',\n      'Asset Management':'Asset Management — 1,204 assets with owner, criticality and the scopes each falls into.',\n      'Findings':'Findings — 6 open. 1 critical, 2 high, 3 medium. All have an owner and a remediation date.',\n      'Risk Register':'Risk Register — accepted risks with their expiry dates and the approver who signed them off.',\n      'Action Plans':'Action Plans — 9 remediation plans, 3 awaiting approval and 2 past their target date.',\n      'Audit Log':'Audit Log — append-only record of every scope change, approval and evidence upload.',\n      'Settings':'Settings — organisation defaults, roles, frameworks, notifications and integrations.'\n    };\n    np.querySelectorAll('[data-nav]').forEach(function(b){\n      b.onclick=function(){\n        np.querySelectorAll('[data-nav]').forEach(function(x){x.setAttribute('aria-current','false');});\n        b.setAttribute('aria-current','true');\n        crumb.textContent=b.dataset.nav;\n        body.textContent=COPY[b.dataset.nav];\n      };\n    });\n    const cb=document.getElementById('collapseBtn');\n    if(cb) cb.onclick=function(){\n      np.classList.toggle('coll');\n      const on=np.classList.contains('coll');\n      np.querySelectorAll('.np-lb').forEach(function(l){l.style.display=on?'none':'';});\n      np.querySelectorAll('.np-gl').forEach(function(l){l.style.visibility=on?'hidden':'';});\n      np.querySelectorAll('.np-i').forEach(function(i){i.style.justifyContent=on?'center':'';});\n    };\n  }\n}\n\nwindow.addEventListener('hashchange',function(){go(location.hash.slice(1));});\ngo(location.hash.slice(1)||'colours');\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
